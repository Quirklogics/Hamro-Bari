{% extends "base.html" %}
{% block title %}Error {{ status }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="empty-state">
  <span class="empty-icon" aria-hidden="true">⚠️</span>
  <h3>{{ message }}</h3>
  <p class="mono muted">{{ code }}</p>
  <a class="btn btn-primary" href="{{ url_for('public.voice_home') }}">Back to the voice ordering page</a>
</div>
{% endblock %}
